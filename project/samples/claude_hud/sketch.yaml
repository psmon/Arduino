# arduino-cli 빌드 프로파일 (Waveshare ESP32-S3-(Touch-)LCD-1.28)
# 빌드+업로드: arduino-cli compile --upload -p COM6 project/samples/claude_hud
# WiFi+HTTP+JSON+그래픽이라 Huge APP 파티션 필요. secrets.h 를 먼저 채울 것.
profiles:
  esp32s3:
    notes: Claude Code HUD (WiFi HTTP server -> round LCD)
    fqbn: esp32:esp32:esp32s3:PSRAM=enabled,FlashSize=16M,PartitionScheme=huge_app
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - GFX Library for Arduino (1.6.7)
      - ArduinoJson (7.4.3)

default_profile: esp32s3
