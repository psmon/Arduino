# arduino-cli 빌드 프로파일 (Waveshare ESP32-S3-LCD-1.28)
# 빌드:  arduino-cli compile project/samples/hello_lcd
# 업로드: arduino-cli upload -p COM6 project/samples/hello_lcd
profiles:
  esp32s3:
    notes: Waveshare ESP32-S3-LCD-1.28 (HELLO on GC9A01)
    fqbn: esp32:esp32:esp32s3:PSRAM=enabled,FlashSize=16M
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - GFX Library for Arduino (1.6.7)

default_profile: esp32s3
